name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: Digreatbrian/buildozer-action@v2
        with:
          buildozer-cmd: buildozer android debug
        env:
          ANDROID_ACCEPT_LICENSES: "y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ./**/*.apk
